[package]
name = "tipad"
version = "0.1.0"
description = "Lightweight Windows macro pad companion app"
authors = ["Tiu"]
license = "UNLICENSED"
repository = ""
edition = "2021"

[lib]
name = "tipad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
anyhow = "1.0"
directories = "5.0"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.6"
tauri = { version = "2.5.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.2.6"
tauri-plugin-shell = "2.2.1"
thiserror = "1.0"
