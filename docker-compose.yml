services:
  tiu-agent:
    build:
      context: .
    container_name: tiu-agent
    hostname: ${SERVER_HOSTNAME:-tiuserver}
    restart: unless-stopped
    pid: host
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_HOSTNAME: ${SERVER_HOSTNAME:-tiuserver}
      STORAGE_PATHS: ${STORAGE_PATHS:-/host/opt/apps,/host/opt/infra,/home}
      DOCKER_SOCKET_PATH: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/apps:/host/opt/apps:ro
      - /opt/infra:/host/opt/infra:ro
      - /opt/backups:/host/opt/backups:ro
      - /sys/class/net:/host/sys/class/net:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 8080) + '/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
